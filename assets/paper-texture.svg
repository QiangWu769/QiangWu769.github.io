<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.64" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .46  0 0 0 0 .43  0 0 0 0 .37  0 0 0 .95 -.43"/>
    </filter>
    <filter id="fibers" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.085 0.27" numOctaves="2" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .46  0 0 0 0 .43  0 0 0 0 .37  0 0 0 1.15 -.52"/>
    </filter>
    <filter id="soft-mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="21" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .48  0 0 0 0 .37  0 0 0 0 .23  0 0 0 .14 -.04"/>
    </filter>
  </defs>
  <!-- Stronger fine detail, with the broad mottling kept faint. -->
  <path d="M0 0h480v480H0z" filter="url(#soft-mottle)" opacity=".18"/>
  <path d="M0 0h480v480H0z" filter="url(#fibers)" opacity=".24"/>
  <path d="M0 0h480v480H0z" filter="url(#grain)" opacity=".34"/>
</svg>
